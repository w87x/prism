name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          # testutil.DB creates and drops a throwaway database per test against this admin connection.
          # 127.0.0.1, not localhost: some Actions runners resolve localhost to ::1 first, which the
          # service container's port mapping does not reliably answer on.
          PRISM_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        # -p 4: each test creates and migrates its own throwaway database (testutil.DB), so unbounded
        # cross-package parallelism means many of those landing on the Postgres service at once — fine on
        # a beefy local machine, but it can overload a shared 2-core runner. Capped, not serialized.
        run: go test ./... -timeout 25m -p 4

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build
